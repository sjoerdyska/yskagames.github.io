<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POTEN — rigid box (base + lid)</title>
<style>
  :root{--cream:#f2ede1;--cream2:#e8e1d1;--ink:#2b2420;--muted:#6f665a;--teal:#1a635c;--teal-d:#124a45;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
    background:rgb(255,250,245);overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0} canvas{display:block;touch-action:none}
  .hdr{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:baseline;gap:12px;pointer-events:none;z-index:5}
  .hdr .brand{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--teal);text-transform:uppercase}
  .hdr .sub{font-size:12.5px;color:var(--muted)} .hdr .sub b{color:var(--ink);font-weight:600}
  .dock{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:6;display:flex;gap:8px;padding:7px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(43,36,32,.09);border-radius:14px;box-shadow:0 8px 30px rgba(43,36,32,.10)}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:transparent;
    padding:9px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s;white-space:nowrap}
  .btn:hover{background:rgba(26,99,92,.10)} .btn.primary{background:var(--teal);color:#fff} .btn.primary:hover{background:var(--teal-d)}
  .btn.on{background:rgba(26,99,92,.16);color:var(--teal-d)} .btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55} .btn.on .dot{opacity:1}
  .sep{width:1px;background:rgba(43,36,32,.10);margin:4px 2px}
  .hint{position:absolute;right:22px;bottom:26px;z-index:5;font-size:12px;color:var(--muted);pointer-events:none;text-align:right;line-height:1.5}
  .spec{position:absolute;left:22px;bottom:26px;z-index:5;font-size:12px;color:var(--muted);pointer-events:none;line-height:1.6} .spec b{color:var(--ink);font-weight:600}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:5px;transform:translateY(-1px);border:1px solid rgba(0,0,0,.12)}
  #load{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--cream);transition:opacity .5s}
  #load.hide{opacity:0;pointer-events:none} .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(26,99,92,.18);border-top-color:var(--teal);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:560px){.hdr{flex-direction:column;gap:2px;padding:14px 16px}.hint{display:none}.spec{font-size:11px;left:16px;bottom:76px}.dock{bottom:14px;gap:4px;padding:6px}.btn{padding:9px 11px;font-size:12.5px}}
  @media (prefers-reduced-motion:reduce){.ring{animation-duration:2s}}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock">
  <button class="btn on" id="spin"><span class="dot"></span><span>Auto-rotate</span></button>
</div>
<div id="load"><div class="ring"></div></div>

/* ---------------- rounded-box geometry with per-face planar UVs ----------------
   Each of the 6 faces is generated as its own graded grid at the outer plane and
   projected back onto the true rounded surface (clamp method). Faces stay planar-
   mapped (art correct) while the wrap curves around a radius r at every edge.
   Face/material order: 0:+X 1:-X 2:+Y 3:-Y 4:+Z 5:-Z (matches THREE.BoxGeometry). */
function roundedBoxGeometry(w,h,d,r,seg,skip){
  skip=skip||[];
  r=Math.max(0.0001,Math.min(r, Math.min(w,h,d)/2-0.001));
  const hx=w/2,hy=h/2,hz=d/2, ix=hx-r,iy=hy-r,iz=hz-r;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function samples(H){ const I=H-r,a=[]; for(let i=0;i<=seg;i++)a.push(-H+r*(i/seg)); a.push(I); for(let i=1;i<=seg;i++)a.push(I+r*(i/seg)); return a; }
  function round(x,y,z){ const cx=clamp(x,-ix,ix),cy=clamp(y,-iy,iy),cz=clamp(z,-iz,iz);
    let dx=x-cx,dy=y-cy,dz=z-cz; const L=Math.hypot(dx,dy,dz);
    if(L>1e-6){const k=r/L;return[cx+dx*k,cy+dy*k,cz+dz*k, dx/L,dy/L,dz/L];} return[x,y,z,0,0,0]; }
  function uvFor(f,x,y,z){
    switch(f){
      case 0: return [(-z/hz+1)/2,(y/hy+1)/2];
      case 1: return [( z/hz+1)/2,(y/hy+1)/2];
      case 2: return [(x/hx+1)/2,(-z/hz+1)/2];
      case 3: return [(x/hx+1)/2,( z/hz+1)/2];
      case 4: return [(x/hx+1)/2,(y/hy+1)/2];
      default:return [(-x/hx+1)/2,(y/hy+1)/2];
    }
  }
  const pos=[],nor=[],uv=[],groups=[];
  // face definitions: normal axis + the two in-plane axes (in u,v order)
  const F=[
    {f:0,fix:'x',s: 1,U:'z',V:'y'},{f:1,fix:'x',s:-1,U:'z',V:'y'},
    {f:2,fix:'y',s: 1,U:'x',V:'z'},{f:3,fix:'y',s:-1,U:'x',V:'z'},
    {f:4,fix:'z',s: 1,U:'x',V:'y'},{f:5,fix:'z',s:-1,U:'x',V:'y'},
  ];
  const Hof={x:hx,y:hy,z:hz};
  for(const fd of F){
    if(skip.indexOf(fd.f)>=0) continue;
    const start=pos.length/3;
    const su=samples(Hof[fd.U]), sv=samples(Hof[fd.V]);
    const fixV=fd.s*Hof[fd.fix];
    function P(iu,iv){ const o={}; o[fd.fix]=fixV; o[fd.U]=su[iu]; o[fd.V]=sv[iv];
      const R=round(o.x,o.y,o.z); const uvv=uvFor(fd.f,R[0],R[1],R[2]);
      return {p:[R[0],R[1],R[2]], n:[R[3],R[4],R[5]], t:uvv}; }
    for(let a=0;a<su.length-1;a++){
      for(let b=0;b<sv.length-1;b++){
        const v00=P(a,b),v10=P(a+1,b),v11=P(a+1,b+1),v01=P(a,b+1);
        // two triangles; DoubleSide material makes winding irrelevant
        for(const t of [v00,v10,v11, v00,v11,v01]){ pos.push(...t.p); nor.push(...t.n); uv.push(...t.t); }
      }
    }
    groups.push({start:start, count:(pos.length/3)-start, mat:fd.f});
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  for(const gr of groups) g.addGroup(gr.start,gr.count,gr.mat);
  return g;
}

/* ---------------- renderer / scene / camera ---------------- */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(app.clientWidth,app.clientHeight);
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,app.clientWidth/app.clientHeight,1,5000);

scene.add(new THREE.HemisphereLight(0xffffff,0xcfc7b6,0.62));
const key=new THREE.DirectionalLight(0xffffff,1.2); key.position.set(78,150,96); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=20; key.shadow.camera.far=520;
key.shadow.camera.left=-100;key.shadow.camera.right=100;key.shadow.camera.top=110;key.shadow.camera.bottom=-110;
key.shadow.bias=-0.0004; key.shadow.radius=3; scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.42); fill.position.set(-110,55,40); scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,0.55); rim.position.set(-50,80,-120); scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.ShadowMaterial({opacity:0.65}));
ground.rotation.x=-Math.PI/2; ground.position.y=-H/2-0.15; ground.receiveShadow=true; scene.add(ground);

/* ---------------- materials ---------------- */
const manager=new THREE.LoadingManager(); const loader=new THREE.TextureLoader(manager);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function tex(u){const t=loader.load(u);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;return t;}
const SIDE=THREE.DoubleSide;
const WHITE=new THREE.MeshStandardMaterial({color:0xf7f5f0,roughness:0.94,side:SIDE});
const BOARD=new THREE.MeshStandardMaterial({color:0xa89e90,roughness:1.0,side:SIDE});
const CREAM=new THREE.MeshStandardMaterial({color:0xece4d3,roughness:0.9,side:SIDE});
const CARD =new THREE.MeshStandardMaterial({color:0xefe9dc,roughness:0.85,side:SIDE});
function art(u){return new THREE.MeshStandardMaterial({map:tex(u),roughness:0.86,side:SIDE});}

const OPP={0:1,1:0,2:3,3:2,4:5,5:4};
function panelRB(w,h,d,r,seg,outerIdx,outerMat,inMat,edgeMat){
  const mats=[edgeMat,edgeMat,edgeMat,edgeMat,edgeMat,edgeMat];
  mats[outerIdx]=outerMat; mats[OPP[outerIdx]]=inMat;
  const m=new THREE.Mesh(roundedBoxGeometry(w,h,d,r,seg),mats);
  m.castShadow=true; m.receiveShadow=true; return m;
}

/* ---------------- LID : one rounded shell, all faces wrapped, rounded edges ----------------
   +X right spine · -X left spine · +Y sky/POTEN · -Y barcode · +Z raccoon · -Z descriptions */
const lid=new THREE.Group();
/* LID : outer wrap shell, left OPEN at the back (-Z).
   +X right spine · -X left spine · +Y sky/POTEN · -Y barcode · +Z raccoon */
const lidMats=[art(TEX.right),art(TEX.left),art(TEX.top),art(TEX.bottom),art(TEX.front),BOARD];
const lidMesh=new THREE.Mesh(roundedBoxGeometry(W,H,D,REDGE,4,[5]),lidMats);
lidMesh.castShadow=true; lidMesh.receiveShadow=true; lid.add(lidMesh);
/* BASE : inner tray nested inside the lid. Its rear panel carries the descriptions and
   sits recessed inside the lid's back opening, so the two-piece seam shows all around. */
const INSET=0.8;
const bW=W-2*INSET, bH=H-2*INSET, bD=D-2*INSET;
const baseMats=[BOARD,BOARD,BOARD,BOARD,BOARD,art(TEX.back)];
const baseMesh=new THREE.Mesh(roundedBoxGeometry(bW,bH,bD,1.5,4),baseMats);
baseMesh.position.set(0,0,0);   // centered; back sits recessed INSET mm inside the open rim
baseMesh.castShadow=true; baseMesh.receiveShadow=true; lid.add(baseMesh);
scene.add(lid);

/* ---------------- controls ---------------- */
const target=new THREE.Vector3(0,1.5,0); let az=0.62,pol=1.16,rad=250; const RAD_MIN=120,RAD_MAX=470;
function applyCam(){const sp=Math.sin(pol),cp=Math.cos(pol);
  camera.position.set(target.x+rad*sp*Math.sin(az),target.y+rad*cp,target.z+rad*sp*Math.cos(az)); camera.lookAt(target);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let dragging=false,lx=0,ly=0; const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointerup',()=>{dragging=false;}); el.addEventListener('pointercancel',()=>{dragging=false;});
el.addEventListener('pointermove',e=>{if(!dragging)return; az-=(e.clientX-lx)*0.005; pol=clamp(pol-(e.clientY-ly)*0.005,0.16,Math.PI-0.16); lx=e.clientX;ly=e.clientY;});
el.addEventListener('wheel',e=>{e.preventDefault(); rad=clamp(rad*(1+e.deltaY*0.0012),RAD_MIN,RAD_MAX);},{passive:false});
let pinch=0;
el.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=dist2(e);},{passive:false});
el.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dd=dist2(e);if(pinch)rad=clamp(rad*(pinch/dd),RAD_MIN,RAD_MAX);pinch=dd;}},{passive:false});
el.addEventListener('touchend',()=>{pinch=0;});
function dist2(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

/* ---------------- UI ---------------- */
let autoRotate=true;
const spinBtn=document.getElementById('spin');
spinBtn.addEventListener('click',()=>{autoRotate=!autoRotate; spinBtn.classList.toggle('on',autoRotate);});
function resize(){const w=app.clientWidth,h=app.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

function tick(){requestAnimationFrame(tick);
  if(autoRotate&&!dragging)az+=0.0032; applyCam(); renderer.render(scene,camera);}
manager.onLoad=()=>{document.getElementById('load').classList.add('hide');};
setTimeout(()=>document.getElementById('load').classList.add('hide'),4000);
resize(); applyCam(); tick();
</script>
</body>
</html>
